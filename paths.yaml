# Every file path this repository's configuration references, checked by
#   riscv-tools --root . check-paths --manifest paths.yaml
# (needs Core cloned next to this repository: ../Core).
repository: Peripherals
references:
  - {name: per-entity tests.json, file: tests/python/tests.json, yaml: "*.sources", base: .}
  - {name: entry points, paths: [tests/python/runner.py, src/GPIO/soc, src/TIMER/soc, src/CLINT/soc, src/PLIC/soc, src/PS2/host, src/PS2/keyboard, src/PS2/mouse, src/UART/serial, src/UART/jtag, src/UART/console, src/display/soc, src/video/soc, src/flash-controller/soc, tests/vhdl/gpio_tb.vhd, tests/vhdl/ps2_host_tb.vhd, tests/vhdl/ps2_keyboard_tb.vhd, tests/vhdl/ps2_mouse_top_tb.vhd, tests/vhdl/ps2_cable_tb.vhd, tests/vhdl/gpio_zero_tb.vhd, tests/vhdl/seg_display_zero_tb.vhd, src/common/src/flip_flop.vhd, tests/vhdl/console_equiv.vhd]}
  - {name: formal proofs, paths: [formal/run.sh, formal/aggregate.sh, formal/alu_ge_unsigned_props.sv, formal/counter_overflow_props.sv, formal/clock_prescaler_props.sv, formal/timer_props.sv, formal/clint_props.sv, formal/plic.sh, formal/plic_props.sv, formal/plic_gateway_props.sv, formal/plic_arbiter_props.sv, formal/flash_controller_props.sv, formal/gpio_cell_props.sv, formal/uart_props.sv, formal/jtag_uart_props.sv, formal/uart_fifo_props.sv, docs/pt-br/formal/formal.md, docs/en/formal/formal.md]}
  - {name: CLINT documents, paths: [docs/pt-br/CLINT/clint.md, docs/en/CLINT/clint.md]}
  - {name: PLIC documents, paths: [docs/pt-br/PLIC/plic.md, docs/en/PLIC/plic.md]}
  - {name: FLASH controller documents, paths: [docs/pt-br/flash-controller/flash_controller.md, docs/en/flash-controller/flash_controller.md]}
  - {name: serial UART documents, paths: [docs/pt-br/UART/serial_uart.md, docs/en/UART/serial_uart.md]}
  - {name: display documents, paths: [docs/pt-br/display/seg_display.md, docs/en/display/seg_display.md]}
  - {name: video documents, paths: [docs/pt-br/video/video.md, docs/en/video/video.md]}
  - {name: GPIO documents, paths: [docs/pt-br/GPIO/gpio.md, docs/en/GPIO/gpio.md]}
  - {name: PS2 documents, paths: [docs/pt-br/PS2/ps2_host.md, docs/en/PS2/ps2_host.md, docs/pt-br/PS2/ps2_keyboard.md, docs/en/PS2/ps2_keyboard.md]}
  - {name: PS2 mouse documents, paths: [docs/pt-br/PS2/ps2_mouse.md, docs/en/PS2/ps2_mouse.md]}
  - {name: console documents, paths: [docs/pt-br/UART/console.md, docs/en/UART/console.md]}
  - {name: JTAG UART documents, paths: [docs/pt-br/UART/jtag_uart.md, docs/en/UART/jtag_uart.md, docs/pt-br/bugs/JTAG_UART_RESPOSTA_PERDIDA.md, docs/en/bugs/JTAG_UART_RESPOSTA_PERDIDA.md]}
tree:
  coverage:
    formal:
      alu_ge_unsigned: []
      clock_prescaler: []
      counter_overflow: []
      gpio_cell: []
      timer: []
      uart: []
      uart_fifo: []
  # The peripherals are named after what they are, in capitals, like the extensions of the Core.
  identifier_folders: [CLINT, GPIO, PLIC, PS2, TIMER, UART]

provides:
  # Each component lists its sources in GHDL dependency order and the components it needs. A requires with the
  # prefix Common-Components/ names a block of the submodule at src/common. A component is a folder of src/ with
  # the capitals of the peripheral; the Cyclone V shells are apart because only the board needs them.
  alu_ge_unsigned:
    requires: []
    sources:
      - src/TIMER/soc/alu_ge_unsigned.vhd
  CLINT:
    requires: [Common-Components/registers, Common-Components/counter64, alu_ge_unsigned]
    sources:
      - src/CLINT/soc/clint_consts.vhd
      - src/CLINT/soc/clint.vhd
  GPIO:
    requires: [Common-Components/registers, Common-Components/mux, Common-Components/synchronizer, Common-Components/tristate_buffer]
    sources:
      - src/GPIO/soc/gpio_operation_decoder.vhd
      - src/GPIO/soc/gpio_cell.vhd
      - src/GPIO/soc/gpio.vhd
  TIMER:
    requires: [Common-Components/adder, Common-Components/registers, Common-Components/mux, Common-Components/tristate_buffer, alu_ge_unsigned]
    sources:
      - src/TIMER/soc/counter_overflow.vhd
      - src/TIMER/soc/clock_prescaler.vhd
      - src/TIMER/soc/timer_operation_decoder.vhd
      - src/TIMER/soc/timer.vhd
  opencores_uart2bus:
    requires: []
    sources:
      - src/UART/serial/vendor/opencores_uart2bus/uart2BusTop_pkg.vhd
      - src/UART/serial/vendor/opencores_uart2bus/baudGen.vhd
      - src/UART/serial/vendor/opencores_uart2bus/uartRx.vhd
      - src/UART/serial/vendor/opencores_uart2bus/uartTx.vhd
      - src/UART/serial/vendor/opencores_uart2bus/uartTop.vhd
  UART:
    requires: [opencores_uart2bus]
    sources:
      - src/UART/serial/uart_fifo.vhd
      - src/UART/serial/uart.vhd
  jtag_uart:
    requires: [Common-Components/synchronizer]
    sources:
      - src/UART/jtag/jtag_uart.vhd
  console:
    requires: [UART, jtag_uart]
    sources:
      - src/UART/console/console.vhd
  jtag_uart_shell:
    requires: [jtag_uart, Common-Components/virtual_jtag]
    sources:
      - src/UART/jtag/cyclone-v/jtag_uart_shell.vhd
  ps2_host:
    requires: [Common-Components/synchronizer, Common-Components/tristate_buffer]
    sources:
      - src/PS2/host/ps2_filter.vhd
      - src/PS2/host/ps2_host.vhd
  ps2_keyboard:
    requires: [ps2_host, UART]
    sources:
      - src/PS2/keyboard/ps2_keyboard.vhd
  ps2_mouse:
    requires: [Common-Components/registers, Common-Components/mux]
    sources:
      - src/PS2/mouse/ps2_mouse_consts.vhd
      - src/PS2/mouse/ps2_axis_accumulator.vhd
      - src/PS2/mouse/ps2_mouse_decoder.vhd
      - src/PS2/mouse/ps2_mouse_operation_decoder.vhd
      - src/PS2/mouse/ps2_mouse.vhd
  ps2_mouse_top:
    requires: [ps2_host, ps2_mouse]
    sources:
      - src/PS2/mouse/ps2_mouse_top.vhd
  video:
    requires: [Common-Components/utils, Common-Components/synchronizer]
    sources:
      - src/video/soc/video_consts.vhd
      - src/video/soc/video_dpram.vhd
      - src/video/soc/video_timing.vhd
      - src/video/soc/video_scanout.vhd
      - src/video/soc/video_regs.vhd
      - src/video/soc/video.vhd
  display:
    requires: [Common-Components/synchronizer]
    sources:
      - src/display/soc/hex_to_seg7.vhd
      - src/display/soc/seg_display.vhd
  display_shell:
    requires: [display, Common-Components/virtual_jtag]
    sources:
      - src/display/cyclone-v/seg_display_shell.vhd
  flash-controller:
    requires: [Common-Components/utils]
    sources:
      - src/flash-controller/soc/flash_controller.vhd
  PLIC:
    requires: []
    sources:
      - src/PLIC/soc/plic_consts.vhd
      - src/PLIC/soc/plic_gateway.vhd
      - src/PLIC/soc/plic_arbiter.vhd
      - src/PLIC/soc/plic.vhd
