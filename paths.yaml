tree:
  coverage:
    formal:
      alu_ge_unsigned: []
      audio: []
      audio_frame_clocks: []
      audio_xck_gen: []
      clock_prescaler: []
      counter_overflow: []
      gpio: []
      eth_async_fifo: []
      eth_crc32: []
      eth_regs: []
      eth_speed: []
      gpio_cell: []
      seg_display: []
      ir_fifo: []
      ir_regs: []
      lcd_phy: []
      lcd_regs: []
      i2c_core: []
      i2c_master: []
      hdmi_i2c_writer: []
      hdmi_audio: []
      hdmi_init_seq: []
      hdmi_regs: []
      max10_adc_sequencer: []
      timer: []
      tv_capture: []
      tv_regs: []
      uart: []
      uart_fifo: []
    exceptions:
      max10_adc_ip: wraps the Quartus IP altera_modular_adc, covered by the synthesis check of tests/quartus
      max10_adc_shell: structural top of the board, covered by the synthesis check of tests/quartus
  # The peripherals are named after what they are, in capitals, like the extensions of the Core.
  identifier_folders: [ADC, ADXL345, CLINT, ETH, GPIO, HDMI, I2C, IR, LCD, PLIC, PS2, SD, SPI, TIMER, TV, UART, USB]
  vhdl_style:
    # The generated IP altera_modular_adc (max10_adc_core) and the Verilog PLL max10_adc_pll enter as component, and their
    # names are not yet in vendor_primitives.yaml of riscv-tools; the two files that declare them are left out like the
    # other generated IP. The two DDR registers of the RGMII board build wrap the megafunctions altddio_in and
    # altddio_out (library altera_mf), which also enter as component and are not in that list either.
    exclude: [src/ADC/max10/max10_adc_ip.vhd, src/ADC/max10/max10_adc_shell.vhd, src/ETH/rgmii/altera/eth_ddr_in.vhd,
      src/ETH/rgmii/altera/eth_ddr_out.vhd]

provides:
  # Each component lists its sources in GHDL dependency order and the components it needs. A requires with the
  # prefix Common-Components/ names a block of the submodule at src/common. A component is a folder of src/ with
  # the capitals of the peripheral; the Cyclone V shells are apart because only the board needs them.
  alu_ge_unsigned:
    requires: []
    sources:
      - src/TIMER/soc/alu_ge_unsigned.vhd
  I2C:
    requires: [Common-Components/config, Common-Components/synchronizer]
    sources:
      - src/I2C/soc/i2c_consts.vhd
      - src/I2C/soc/i2c_core.vhd
      - src/I2C/soc/i2c_master.vhd
  ADC:
    requires: [Common-Components/config]
    sources:
      - src/ADC/soc/max10_adc_consts.vhd
      - src/ADC/soc/max10_adc_sequencer.vhd
      - src/ADC/soc/max10_adc.vhd
  max10_adc_shell:
    # Board only: needs the IP that src/ADC/max10/ip/generate.sh makes (max10_adc_core.qip) and the altpll megafunction.
    requires: [ADC]
    sources:
      - src/ADC/max10/max10_adc_ip.vhd
      - src/ADC/max10/max10_adc_pll.v
      - src/ADC/max10/max10_adc_shell.vhd
  CLINT:
    requires: [Common-Components/registers, Common-Components/counter64, alu_ge_unsigned]
    sources:
